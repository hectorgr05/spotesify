services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: spotesify-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: spotesify-prometheus
    volumes:
      - /home/alumno/spotesify/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    

  grafana:
    image: grafana/grafana:10.4.1
    container_name: spotesify-grafana
    ports:
      - "3001:3000"
    

